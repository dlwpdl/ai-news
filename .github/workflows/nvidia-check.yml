name: NVIDIA API Check

on: workflow_dispatch

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe NVIDIA API
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          echo "key length: ${#NVIDIA_API_KEY}"
          echo "== GET /v1/models"
          curl -sS -o /tmp/models.json -w "http=%{http_code} time=%{time_total}s\n" --max-time 45 \
            -H "Authorization: Bearer $NVIDIA_API_KEY" \
            https://integrate.api.nvidia.com/v1/models || echo "curl exit $?"
          head -c 300 /tmp/models.json; echo
          for model in meta/llama-3.3-70b-instruct openai/gpt-oss-120b minimaxai/minimax-m3; do
            echo "== POST chat/completions $model"
            curl -sS -o /tmp/chat.json -w "http=%{http_code} time=%{time_total}s\n" --max-time 90 \
              -H "Authorization: Bearer $NVIDIA_API_KEY" -H "Content-Type: application/json" \
              -d "{\"model\":\"$model\",\"messages\":[{\"role\":\"user\",\"content\":\"say ok\"}],\"max_tokens\":10}" \
              https://integrate.api.nvidia.com/v1/chat/completions || echo "curl exit $?"
            head -c 300 /tmp/chat.json; echo
          done

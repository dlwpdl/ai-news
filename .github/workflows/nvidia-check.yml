name: NVIDIA API Check

on: workflow_dispatch

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Node fetch vs curl comparison
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          cat > /tmp/probe.mjs <<'EOF'
          const apiKey = process.env.NVIDIA_API_KEY;
          const article = (i) => `${i}.\nsource: Example Blog\ntitle: New agent framework release ${i} with tool use and MCP support\nsnippet: The team announced version ${i} of the framework focusing on multi-step agent workflows, retrieval augmented generation, evaluation harnesses and deployment tooling. Benchmarks show improved latency and cost estimates for production use. Developers can integrate via the new SDK and CLI with streaming support and typed clients. The release notes include migration guides, breaking changes and a roadmap for multimodal support in coming quarters.`;
          const bigPrompt = [
            '아래 AI News 기사 6개를 한국어 텔레그램 digest로 요약하세요.',
            '반드시 JSON만 반환하세요: {"overview":["..."],"items":[{"level":"L8","category":"...","summary":"...","action":"...","why":"..."}]}',
            'overview는 전체 흐름 1~2개, 각 70자 이내입니다.',
            'items는 입력 순서와 개수를 그대로 맞추세요. category는 12자 이내입니다.',
            'summary는 100~160자, 1~2문장으로 설명하세요.',
            'action은 60자 이내, why는 50자 이내입니다.',
            '',
            [1,2,3,4,5,6].map(article).join('\n\n'),
          ].join('\n');
          const smallPrompt = '아래 기사 1개를 한국어로 90자 이내 요약하세요.\n\n' + article(1);

          async function probe(label, { prompt, accept }) {
            const started = Date.now();
            try {
              const response = await fetch('https://integrate.api.nvidia.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                  ...(accept ? { Accept: 'application/json' } : {}),
                  'Content-Type': 'application/json',
                  Authorization: `Bearer ${apiKey}`,
                },
                signal: AbortSignal.timeout(80_000),
                body: JSON.stringify({
                  model: 'openai/gpt-oss-120b',
                  messages: [
                    { role: 'system', content: '뉴스를 한국어로 간결하게 요약하는 편집자입니다. JSON만 출력하세요.' },
                    { role: 'user', content: prompt },
                  ],
                  max_tokens: 4000,
                  temperature: 0.2,
                  top_p: 0.95,
                }),
              });
              const data = await response.json();
              console.log(label, 'status', response.status, `${Date.now() - started}ms`,
                'completion_tokens', data.usage?.completion_tokens,
                'content head', (data.choices?.[0]?.message?.content || '').slice(0, 60).replace(/\n/g, ' '));
            } catch (error) {
              console.log(label, 'FAILED', `${Date.now() - started}ms`, String(error));
            }
          }

          console.log('node', process.version);
          await probe('big+accept   ', { prompt: bigPrompt, accept: true });
          await probe('big-accept   ', { prompt: bigPrompt, accept: false });
          await probe('small+accept ', { prompt: smallPrompt, accept: true });
          EOF
          echo "== curl baseline (big payload)"
          node -e "const fs=require('fs');const a=i=>i+'. example article about agent frameworks and RAG pipelines with SDK and CLI support, benchmarks, migration guides and roadmap details for multimodal support.';fs.writeFileSync('/tmp/req.json',JSON.stringify({model:'openai/gpt-oss-120b',max_tokens:4000,temperature:0.2,top_p:0.95,messages:[{role:'system',content:'뉴스를 한국어로 요약하는 편집자입니다. JSON만 출력하세요.'},{role:'user',content:'아래 기사 6개를 한국어 JSON digest로 요약하세요.\n'+[1,2,3,4,5,6].map(a).join('\n')}]}))"
          curl -sS -o /tmp/out.json -w "http=%{http_code} time=%{time_total}s\n" --max-time 120 \
            -H "Authorization: Bearer $NVIDIA_API_KEY" -H "Content-Type: application/json" \
            -d @/tmp/req.json https://integrate.api.nvidia.com/v1/chat/completions || echo "curl exit $?"
          echo "== node fetch probes"
          node /tmp/probe.mjs

name: NVIDIA API Check

on: workflow_dispatch

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Measure true queue latency and rate-limit headers
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          node -e "const fs=require('fs');const a=i=>i+'. example article about agent frameworks and RAG pipelines with SDK and CLI support, benchmarks, migration guides and roadmap details for multimodal support.';fs.writeFileSync('/tmp/req.json',JSON.stringify({model:'openai/gpt-oss-120b',max_tokens:2000,temperature:0.2,messages:[{role:'system',content:'뉴스를 한국어로 요약하는 편집자입니다. JSON만 출력하세요.'},{role:'user',content:'아래 기사 6개를 한국어 JSON digest로 요약하세요.\n'+[1,2,3,4,5,6].map(a).join('\n')}]}))"
          for i in 1 2; do
            echo "== attempt $i: chat/completions max-time 600, dump headers"
            curl -sS -o /tmp/out.json -D /tmp/headers.txt -w "http=%{http_code} connect=%{time_connect}s ttfb=%{time_starttransfer}s total=%{time_total}s\n" --max-time 600 \
              -H "Authorization: Bearer $NVIDIA_API_KEY" -H "Content-Type: application/json" \
              -d @/tmp/req.json https://integrate.api.nvidia.com/v1/chat/completions || echo "curl exit $?"
            echo "-- response headers:"
            cat /tmp/headers.txt 2>/dev/null | tr -d '\r' | grep -iE 'ratelimit|retry|nvcf|cf-ray|server|x-request' || true
            echo "-- body head:"
            head -c 200 /tmp/out.json 2>/dev/null; echo
          done
          echo "== GET /v1/models (control)"
          curl -sS -o /dev/null -w "http=%{http_code} total=%{time_total}s\n" --max-time 60 \
            -H "Authorization: Bearer $NVIDIA_API_KEY" https://integrate.api.nvidia.com/v1/models || echo "curl exit $?"
